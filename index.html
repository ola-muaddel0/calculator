<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="logic.js" defer></script>
    <title>Calculator</title>
</head>

<body>
    <div class="number-button-container">
        <div class="numbers-row">
            <button>0</button>
            <button>1</button>
            <button>2</button>
        </div>
        <div class="numbers-row">
            <button>3</button>
            <button>4</button>
            <button>5</button>
        </div>
        <div class="numbers-row">
            <button>6</button>
            <button>7</button>
            <button>9</button>
        </div>
    </div>
    <div class="operators-container">
        <button>+</button>
        <button>-</button>
        <button>*</button>
        <button>/</button>
        <button class="equal-btn">=</button>
    </div>
</body>

</html>
